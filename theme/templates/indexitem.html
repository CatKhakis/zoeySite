{% macro indexitem(item) -%}

    <aside class="indexItem body">

        <article>
            <div class="indexRow">
                <h1 class="entry-title"><a href="{{ SITEURL }}/{{ item.url }}">{{ item.title }}</a></h1>

                <div class="indexTags">
                    {% if item.category %}
                    
                        <a class="tag category" href="{{ SITEURL }}/{{ item.category.url }}">
                            {{ lucide("folder-open") }}
                            {{ item.category }}
                        </a>
                    {% endif %}

                    {% if item.tags %}
                        {% for tag in item.tags %}
                            <a class="tag" href="{{ SITEURL }}/{{ tag.url }}">
                                {{ lucide("tag") }}
                                {{ tag }}
                            </a>
                        {% endfor %}
                    {% endif %}
                </div>
                
            </div>
            <div class="indexRow">
                {% if item.cover %}
                    <img src="{{ item.cover }}" class="img-fluid">
                {% endif %}
                <div>{{ item.summary }}</div>
            </div>
        </article>
    </aside><!-- /#featured -->
{%- endmacro %}
