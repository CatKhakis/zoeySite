{% macro indexitem(item) -%}

    <aside class="indexItem body">

        <article>
            <div class="indexRow">
                <h1 class="entry-title"><a href="{{ SITEURL }}/{{ item.url }}">{{ item.title }}</a></h1>

                <div class="indexTags">
                    {% if item.category %}
                    
                        <div class="tag category">
                            {{ lucide("folder-open") }}
                            <a href="{{ SITEURL }}/{{ item.category.url }}">{{ item.category }}</a>
                        </div>
                    {% endif %}


                    {% if item.tags %}

                        {% for tag in item.tags %}

                            <div class="tag">
                                {{ lucide("tag") }}
                                <a href="{{ SITEURL }}/{{ tag.url }}">{{ tag }}</a>
                            </div>
                        {% endfor %}
                    {% endif %}
                </div>
            </div>
            <div class="indexRow">
                {% if item.cover %}
                    <img src="{{ item.cover }}" class="img-fluid">
                {% endif %}
                <div>{{ item.summary }}</div>
            </div>
        </article>
    </aside><!-- /#featured -->
{%- endmacro %}
