{% macro indexitem(item) -%}

    <aside class="indexItem body">

        <article>
            <div class="indexRow">
                <h1 class="entry-title"><a href="{{ SITEURL }}/{{ item.url }}">{{ item.title }}</a></h1>

                {% if item.category %}
                    <p>
                    Category: <a href="{{ SITEURL }}/{{ item.category.url }}">{{ item.category }}</a>
                    </p>
                {% endif %}

                {% if item.tags %}
                    <p>
                    Tags:
                    {% for tag in item.tags %}
                        <a href="{{ SITEURL }}/{{ tag.url }}">{{ tag }}</a>
                    {% endfor %}
                    </p>
                {% endif %}
            </div>
            <div class="indexRow">
                {% if item.cover %}
                    <img src="{{ item.cover }}" class="img-fluid">
                {% endif %}
                <div>{{ item.summary }}</div>
            </div>
        </article>
    </aside><!-- /#featured -->
{%- endmacro %}
